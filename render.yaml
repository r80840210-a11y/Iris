services:
  - type: web
    name: dropgram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_ru.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BOT_TOKEN
        sync: false   # токен вводится вручную в панели Render
      - key: ADMIN_IDS
        value: "1780243264"
      - key: CREATOR_ID
        value: "1780243264"
      - key: CREATOR_USERNAME
        value: "v1nk_molik"
      - key: API_URL
        value: "http://67.211.221.152:8888"
